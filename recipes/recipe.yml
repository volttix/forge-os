---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: forge-os
description: Forge OS — A gaming-focused Linux distribution built for performance.

# Fedora Atomic KDE Plasma foundation
base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
      - scope: user

  - type: signing
